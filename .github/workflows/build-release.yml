name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build macOS App
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        run: |
          xcodebuild \
            -scheme Reset \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            clean build

      - name: Package DMG
        run: |
          VERSION=$(python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path("project.yml").read_text()
          m = re.search(r'MARKETING_VERSION:\s*"([^"]+)"', text)
          print(m.group(1) if m else "1.0.0")
          PY
          )
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          STAGE="/tmp/reset-dmg-stage"
          mkdir -p "$STAGE"
          cp -R build/Build/Products/Release/Reset!.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -ov -volname "Reset!" -srcfolder "$STAGE" -format UDZO "Reset-${VERSION}.dmg"
          rm -rf "$STAGE"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reset-macOS-DMG
          path: Reset-*.dmg

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Reset-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
